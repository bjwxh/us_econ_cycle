# Parameters for the macro-analog study (spec v1.0, P0). All overridable from the CLI.
as_of: "2026-11-06T14:00:00-05:00"
horizon_months: 24
top_k: 5
raw_top_n: 20
min_gap_months: 18
weights: {employment: 0.40, inflation: 0.30, policy: 0.30}
groups:
  employment: [unrate_level, unrate_chg_6m, payroll_growth_3m, payroll_growth_6m]
  inflation: [cpi_yoy, core_cpi_yoy, core_cpi_6m_ann]
  policy: [ffr_level, ffr_chg_6m]
scaling: robust            # median / IQR, fit on the candidate pool known at the as-of date
zlb_threshold_pct: 0.30    # effective fed funds below this is flagged ZLB (QE periods are NOT separately flagged)
# Release-time rules, used for the REVISED-data mode only (no real vintages yet; that is P1).
release_rules:
  PAYEMS: first_friday_next_month_0830   # BLS Employment Situation
  UNRATE: first_friday_next_month_0830
  CPIAUCSL: day15_next_month_0830        # conservative: BLS CPI usually lands on the 10th-15th
  CPILFESL: day15_next_month_0830
  DFF: next_day_0900                     # effective rate for day d is published the next morning
